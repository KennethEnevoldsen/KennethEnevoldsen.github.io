name: Update publications
on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write # to start the Pages deploy
concurrency:
  group: update-publications
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Fetch OpenAlex and update docs/publications.md
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update_publications.py --report "$RUNNER_TEMP/report.md"
      # Commit straight to the default branch. Pushes made with GITHUB_TOKEN do not trigger
      # other workflows, so the Pages deploy is started explicitly via workflow_dispatch.
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/publications.md data/publications/openalex.bib; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/publications.md data/publications/openalex.bib
          git commit -m "chore: update publications from OpenAlex"
          git push
          if git diff --quiet HEAD~1 -- docs/publications.md; then
            echo "Only the cache changed; no deploy needed."
          else
            gh workflow run docs.yml --ref "${{ github.event.repository.default_branch }}"
          fi
